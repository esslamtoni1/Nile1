name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q nile_store_phase1.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare Android
        working-directory: nile_store
        run: |
          flutter create --platforms=android --org com.nilestore --project-name nile_store /tmp/nile_tmp
          cp -r /tmp/nile_tmp/android ./android
          sed -i 's/android:label="[^"]*"/android:label="Nile Store"/' android/app/src/main/AndroidManifest.xml
      - working-directory: nile_store
        run: flutter pub get
      - working-directory: nile_store
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: nile-store-apk
          path: nile_store/build/app/outputs/flutter-apk/app-release.apk
